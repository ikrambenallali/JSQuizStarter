<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon premier graphique</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<header>
    <nav class="navbar">
        <div class="nav-left">
            <a href="index.html" class="nav-logo">JSQuizStarter</a>
        </div>
        <div class="nav-right">
            <a href="index.html" class="nav-link">Home</a>
            <a href="quiz.html" class="nav-link">Quiz</a>
            <a href="historique.html" class="nav-link">History</a>
            <a href="chart.html" class="nav-link">Statistics</a>
        </div>
    </nav>
</header>
<style>
    header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(251, 244, 250, 0.95) 100%);
    backdrop-filter: blur(10px);
    border-bottom: 2px solid rgba(103, 77, 127, 0.1);
    box-shadow: 0 2px 20px rgba(103, 77, 127, 0.1);
}

.navbar {
    max-width: 1200px;
    margin: 0 auto;
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* Logo à gauche */
.nav-left .nav-logo {
    font-size: 1.8em;
    font-weight: bold;
    color: rgb(103, 77, 127);
    text-decoration: none;
    background: linear-gradient(135deg, rgb(103, 77, 127), rgb(165, 141, 186));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    transition: all 0.3s ease;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
}

.nav-left .nav-logo:hover {
    transform: scale(1.05);
    filter: brightness(1.1);
}

/* Navigation à droite */
.nav-right {
    display: flex;
    gap: 30px;
    align-items: center;
}

.nav-link {
    color: rgb(103, 77, 127);
    text-decoration: none;
    font-weight: 600;
    font-size: 1.1em;
    padding: 12px 20px;
    border-radius: 25px;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
}

.nav-link::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, rgba(196, 71, 175, 0.1), rgba(225, 146, 212, 0.1));
    transition: left 0.3s ease;
    z-index: -1;
}

.nav-link:hover {
    color: rgb(103, 77, 127);
    transform: translateY(-2px);
    background: linear-gradient(135deg, #FBF4FA 0%, #E192D4 30%);
    box-shadow: 0 5px 15px rgba(196, 71, 175, 0.2);
    border: 1px solid rgba(196, 71, 175, 0.3);
}

.nav-link:hover::before {
    left: 0;
}

/* Effet actif sur le lien courant */
.nav-link.active {
    background: linear-gradient(135deg, rgb(165, 141, 186) 0%, rgb(103, 77, 127) 100%);
    color: white;
    box-shadow: 0 4px 12px rgba(103, 77, 127, 0.3);
}

/* Ajustement du body pour compenser la navbar fixe */
body {
    padding-top: 80px; /* Ajustez selon la hauteur de votre navbar */
}

/* Animation d'apparition */
@keyframes slideDown {
    from {
        transform: translateY(-100%);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

header {
    animation: slideDown 0.6s ease-out;
}

/* Responsive */
@media (max-width: 768px) {
    .navbar {
        padding: 12px 15px;
        flex-direction: column;
        gap: 15px;
    }
    
    .nav-left .nav-logo {
        font-size: 1.5em;
    }
    
    .nav-right {
        gap: 20px;
        flex-wrap: wrap;
        justify-content: center;
    }
    
    .nav-link {
        font-size: 1em;
        padding: 10px 15px;
    }
    
    body {
        padding-top: 120px; /* Plus d'espace pour la navbar mobile */
    }
}

@media (max-width: 480px) {
    .nav-right {
        gap: 10px;
    }
    
    .nav-link {
        font-size: 0.9em;
        padding: 8px 12px;
    }
    
    body {
        padding-top: 140px;
    }
}
        

</style>
<body>
    <h1>Statistiques du Quiz</h1>

    <canvas id="myChart" width="400" height="200"></canvas>

    <!-- Graphique 2 : Progression des scores -->
<canvas id="scoreChart" width="400" height="200"></canvas>

    <script src="../js/chart.js"></script>
</body>

</html>
